name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: kvide-linux-x86_64
          - os: macos-latest
            asset: kvide-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -e ".[syntax]"
          python -m pip install pyinstaller==6.11.1

      - name: Build
        working-directory: packaging
        run: python -m PyInstaller --clean --noconfirm kvide.spec

      - name: Smoke test
        run: packaging/dist/kvide --version

      - name: Name the asset
        run: mv packaging/dist/kvide ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
